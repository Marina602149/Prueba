name: Prueba secrets

on: push

jobs:
  comparar:
    runs-on: self-hosted
    env:
      SECRET_DEV: ${{ secrets.DEV_TOKEN }}
    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: bash
        run: |
          if [ "${SECRET_DEV}" = "${LOCAL_DEV_TOKEN}" ]; then
            echo "Los tokens COINCIDEN"
          else
            echo "Los tokens NO coinciden"
            exit 1
          fi
